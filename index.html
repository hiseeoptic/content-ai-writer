<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Vinalink AI MassWriter — Trình Viết Bài Chuyên Nghiệp</title>
    <meta name="description" content="Ứng dụng AI sinh bài viết dài & hàng loạt cho marketing và nội dung." />

    <!-- PWA / Mobile Web App Capable Settings -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#0f172a" />

    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="bg-gray-900 text-gray-100">
    <div id="root"></div>
    <div id="initial-loader">
      <span>Đang tải Vinalink AI MassWriter</span>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // Hide the loader once React has mounted.
      const t = setInterval(() => {
        const root = document.getElementById('root');
        const loader = document.getElementById('initial-loader');
        if (root && root.childElementCount > 0 && loader) {
          loader.style.display = 'none';
          clearInterval(t);
        }
      }, 100);
    </script>
  </body>
</html>
